name: voice_guard
description: VoiceGuard — Real-Time AI Voice Cloning Detector (SIH demo POC).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  permission_handler: ^11.3.1
  flutter_onnxruntime: ^1.8.5
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3
  percent_indicator: ^4.2.5
  flutter_animate: ^4.5.2
  http: ^1.2.2
  flutter_local_notifications: ^17.1.2
  intl: ^0.19.0
  web_socket_channel: ^3.0.1
  flutter_webrtc: ^0.12.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
    - assets/images/
