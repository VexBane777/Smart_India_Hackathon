# channels.yaml — TeleChannel recipe definitions.
#
# Consumed by telechannel/pipeline.py's process_clip(audio, recipe_name).
# Each recipe is a fixed-order chain: RIR -> Noise -> Mic -> Codec -> Loss ->
# Bandlimit. A stage is skipped for a recipe if its config key is null/absent
# (`clean` skips everything except bandlimit toggling); `codec` is always a
# LIST of {codec, bitrate} entries applied in sequence (length 0 = skipped,
# length >1 = tandem transcoding: compress/decompress more than once, as a
# real cross-network call does).
#
# `rir.room` looks up a synthetic room impulse response profile from `rooms`
# below (RT60-ish decay + a unit impulse at sample 0 for the direct path) —
# there is no real RIR/SLR28 library wired up yet, so this is a stand-in
# fingerprint, not a measured impulse response.
#
# Codec names/bitrates below match telechannel/stages/codec.py's CODEC_SPECS.
# See DOC1_TELECHANNEL_SPEC.md section 1.5 for the source recipe table this
# was adapted from.

version: 1
sample_rate: 16000

rooms:
  near:
    rt60_ms: 150
    length_samples: 1200
  medium:
    rt60_ms: 300
    length_samples: 2400
  far:
    rt60_ms: 600
    length_samples: 4800

recipes:
  # Control/debugging recipe: exercises RIR, Noise, Mic, Loss, Bandlimit but
  # deliberately has an EMPTY codec list, so it needs no ffmpeg. This is the
  # "second, ffmpeg-free recipe" used to prove the orchestration logic works
  # end-to-end in environments without ffmpeg installed.
  clean:
    rir: { room: medium, wet_gain: 0.5 }
    noise: { type: white, snr_db: 25 }
    mic: { clip_prob: 0.1 }
    codec: []
    loss: { p_gb: 0.01, p_bg: 0.5 }
    bandlimit: { enabled: false }

  # Landline: G.711 mu-law, narrowband.
  pstn:
    rir: { room: medium, wet_gain: 0.7 }
    noise: { type: white, snr_db: 20 }
    mic: { clip_prob: 0.2 }
    codec:
      - { codec: pcm_mulaw, bitrate: null }
    loss: { p_gb: 0.03, p_bg: 0.30 }
    bandlimit: { enabled: true }

  # 2G: GSM-FR, far/reverberant room, heavier loss, narrowband.
  gsm_2g:
    rir: { room: far, wet_gain: 0.6 }
    noise: { type: pink, snr_db: 12 }
    mic: { clip_prob: 0.3 }
    codec:
      - { codec: libgsm, bitrate: null }
    loss: { p_gb: 0.05, p_bg: 0.25 }
    bandlimit: { enabled: true }

  # 3G cellular: AMR-NB, the Indian cellular workhorse, narrowband.
  cellular_3g:
    rir: { room: medium, wet_gain: 0.7 }
    noise: { type: white, snr_db: 15 }
    mic: { clip_prob: 0.2 }
    codec:
      - { codec: libopencore_amrnb, bitrate: "7.4k" }
    loss: { p_gb: 0.04, p_bg: 0.30 }
    bandlimit: { enabled: true }

  # VoLTE: AMR-WB, wideband, clean near-field room, light loss.
  volte:
    rir: { room: near, wet_gain: 0.5 }
    noise: { type: white, snr_db: 25 }
    mic: { clip_prob: 0.1 }
    codec:
      - { codec: libvo_amrwbenc, bitrate: "23.85k" }
    loss: { p_gb: 0.01, p_bg: 0.40 }
    bandlimit: { enabled: false }

  # WhatsApp: Opus at a low-ish bitrate, higher packet loss (per Doc 1 1.5:
  # "loss: higher"). Wideband, like real WhatsApp/Opus calls — no bandlimit
  # stage, matching Doc 1 1.5's recipe table (band-limiting is only applied
  # to the narrowband recipes: pstn/gsm_2g/cellular_3g/tandem_xnet). The 2s
  # bandlimit regression check lives in test_pipeline.py as a standalone
  # apply_bandlimit test, not piggybacked on this recipe.
  whatsapp:
    rir: { room: near, wet_gain: 0.4 }
    noise: { type: white, snr_db: 20 }
    mic: { clip_prob: 0.15 }
    codec:
      - { codec: libopus, bitrate: "16k" }
    loss: { p_gb: 0.06, p_bg: 0.20 }
    bandlimit: { enabled: false }

  # Acoustic playback loop: a pre-recorded clip played through a small
  # loudspeaker into a phone microphone (the classic "phone's recorder
  # overhears a laptop speaker" demo / scam-call playback scenario). This is
  # deliberately NOT a telephony chain — no digital codec and no packet loss
  # (the loop is analog end-to-end). What it models, and why the deployed
  # model collapses on real playback->mic re-recordings (2026-09-11):
  #   * room reverberation (far room, RT60 600ms, wet 0.6) — the dominant
  #     killer, it smears formant transitions and fills pauses, flattening
  #     exactly the prosody/LFCC cues the model keys on;
  #   * ambient room noise (pink, 12 dB) — lifts the noise floor, dropping
  #     HNR and LFCC SNR (measured on the deployed v11_seqcnn model:
  #     ai_clone_test_clip.wav 0.986 direct -> ~0.01-0.30 re-recorded);
  #   * mic headroom/clipping (clip_prob 0.3);
  #   * speaker+mic spectral shaping (200-3800 Hz) — a small laptop speaker
  #     and a phone mic are both band-limited and rolled off, not POTS-narrow;
  #     uses bandlimit's new low_hz/high_hz overrides (default recipe cutoffs
  #     are still 300-3400).
  # Train with this in the channel mix (e.g. `--channel whatsapp volte
  # playback`) so the model learns these artifacts as fake-presenting instead
  # of pushing them into the "real/human" region.
  playback:
    rir: { room: far, wet_gain: 0.6 }
    noise: { type: pink, snr_db: 12 }
    mic: { clip_prob: 0.3 }
    codec: []
    loss: { p_gb: 0.0, p_bg: 0.0 }
    bandlimit: { enabled: true, low_hz: 200, high_hz: 3800 }

  # Tandem/cross-network transcoding: two codec round-trips in sequence
  # (AMR-NB then G.711 mu-law), simulating a call that crosses two networks
  # and gets transcoded at the gateway between them.
  tandem_xnet:
    rir: { room: medium, wet_gain: 0.7 }
    noise: { type: pink, snr_db: 12 }
    mic: { clip_prob: 0.25 }
    codec:
      - { codec: libopencore_amrnb, bitrate: "7.4k" }
      - { codec: pcm_mulaw, bitrate: null }
    loss: { p_gb: 0.05, p_bg: 0.25 }
    bandlimit: { enabled: true }
