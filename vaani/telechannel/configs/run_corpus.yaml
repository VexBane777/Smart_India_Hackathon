# run_corpus.yaml — corpus generation run config.
#
# Consumed by telechannel/manifest.py (split fractions / seed / hold-out
# defaults) and, eventually, a corpus-generation driver script (scripts/
# per DOC1_TELECHANNEL_SPEC.md section 1.2's repo layout) that calls
# telechannel.pipeline.process_clip per recipe and telechannel.manifest.
# write_manifest_row per output clip. This file does not encode individual
# channel recipes -- those live in channels.yaml -- only run-level sizing,
# manifest location, split fractions, and the four hold-out definitions
# from master plan section 5.4 / DOC1 section 1.6 hard rule 1.

version: 1

manifest:
  path: data/manifest.parquet
  # DOC1 1.6 hard rule 4: any row missing/blank on one of these fails QA
  # and is rejected by manifest.write_manifest_row's validation.
  required_fields:
    - source_clip
    - generator
    - accent
    - codec_chain
    - bitrate
    - loss_pct
    - snr_db
    - rir_id
    - license
    - consent
    - speaker_anon
    - noise

splits:
  # Fractions are of ROWS; actual split sizes deviate somewhat from these
  # targets because whole source_clip/speaker_anon groups (never individual
  # rows or windows) are assigned to a split -- see manifest.generate_splits.
  val_frac: 0.15
  test_frac: 0.15
  demo_frac: 0.05
  seed: 42

# The four generalization hold-out sets named in master plan section 5.4:
# "unseen generator (RVC-team), unseen codec (AMR-WB), unseen noise
# (freesound_horn), all real recorded calls." These are carved out via
# manifest.HOLDOUT_FILTERS as filters on manifest fields (never folder
# names, per DOC1 1.6 hard rule 1).
#
# IMPORTANT: these are NOT merely an informational overlay on top of the
# train/val/test/demo split -- manifest.generate_splits() actively enforces
# that any leakage-group (source_clip, or a speaker-merged cluster of
# source_clips) containing a hold-out-matching row is excluded from
# `train` (default: rerouted to `test`, since section 5.4 already frames
# all four as held-out TEST sets). Without this, a hold-out clip/speaker
# could land in train by chance, silently invalidating the "cross-
# generator EER on held-out generator Y" / "unseen generator + In-the-Wild"
# claims the master plan's headline numbers depend on. See
# generate_splits()'s docstring ("Hold-out exclusion from train") for the
# full reasoning and the `exclude_holdouts_from_train` / `holdout_route`
# override knobs.
holdouts:
  unseen_generator:
    field: generator
    value: rvc_team
  unseen_codec:
    field: codec_chain
    value: amr_wb
  unseen_noise:
    field: noise
    value: freesound_horn
  real_calls:
    field: origin
    value: real_call

# Sizing target, per DOC1 section 1.7 (~50-60h real + ~50-60h fake x 6
# recipes ~= 500-600h ~= ~1M two-second windows). Informational only --
# not read by manifest.py; a future corpus-generation driver script would
# use this to decide how many source clips/recipes to run.
sizing:
  target_hours_real: 55
  target_hours_fake: 55
  recipes_per_clip: 6
  window_seconds: 2.0
  audio_format: flac
